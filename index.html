<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Занос</title>
<style>
  :root { --bg: #14161a; --ink: #f2efe6; --muted: #9a9c9f; --accent: #ffb000; --danger: #ff4b3e; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 16px/1.3 "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top)) 16px 0; display: flex;
    justify-content: space-between; align-items: flex-start; pointer-events: none; }
  .hud .score { font-size: 34px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  .hud .best { font-size: 13px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .hud .combo { text-align: right; font-size: 13px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .hud .combo b { display: block; font-size: 28px; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1; }
  .hint { position: fixed; left: 0; right: 0; bottom: calc(24px + env(safe-area-inset-bottom)); text-align: center; color: var(--muted);
    font-size: 14px; pointer-events: none; opacity: 1; transition: opacity .4s; }
  .hint.hide { opacity: 0; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: rgba(20,22,26,.72); backdrop-filter: blur(2px); text-align: center; padding: 24px; }
  .overlay[hidden] { display: none; }
  .overlay h1 { margin: 0; font-size: 44px; font-weight: 900; letter-spacing: -.03em; }
  .overlay .sub { color: var(--muted); max-width: 320px; }
  .overlay .big { font-size: 56px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; margin: 6px 0 0; }
  .overlay .rec { color: var(--accent); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; }
  .overlay button { margin-top: 18px; font: inherit; font-weight: 700; font-size: 18px; padding: 14px 34px; border-radius: 999px; border: 0;
    background: var(--accent); color: #1a1200; cursor: pointer; }
  .overlay button:active { transform: scale(.97); }
  .zones { position: fixed; inset: 0; display: flex; pointer-events: none; }
  .zones div { flex: 1; }
  .zones div.on { background: radial-gradient(ellipse at 50% 100%, rgba(255,176,0,.10), transparent 70%); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="zones" aria-hidden="true"><div id="zl"></div><div id="zr"></div></div>
<div class="hud" aria-live="polite">
  <div><div class="score" id="score">0</div><div class="best">рекорд <span id="best">0</span></div></div>
  <div class="combo"><b id="combo">×1</b>занос</div>
</div>
<div class="hint" id="hint">Левая половина — занос влево, правая — вправо</div>
<div class="overlay" id="start">
  <h1>Занос</h1>
  <div class="sub">Машина едет сама. Держите палец на левой или правой половине экрана, чтобы пустить её в занос, отпустите — выровняется. Очки — за угол и длину заноса. Вылет с трассы — конец заезда.</div>
  <button type="button" id="go">Поехали</button>
</div>
<div class="overlay" id="over" hidden>
  <div class="rec" id="recLabel">Заезд окончен</div>
  <div class="big" id="finalScore">0</div>
  <div class="sub" id="finalSub"></div>
  <button type="button" id="again">Ещё раз</button>
</div>

<script>
(function () {
  'use strict';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize); resize();

  // ── трасса: замкнутая извилистая кривая, повороты в обе стороны ──────────
  const CTRL = [
    [300, 900], [420, 560], [760, 420], [1120, 520], [1300, 820], [1160, 1120],
    [1380, 1380], [1200, 1620], [860, 1560], [640, 1300], [420, 1520], [220, 1300],
  ];
  const TRACK_W = 118;                 // ширина полотна
  function catmull(pts, seg) {
    const out = [];
    const n = pts.length;
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      for (let t = 0; t < 1; t += 1 / seg) {
        const t2 = t * t, t3 = t2 * t;
        out.push([
          0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
          0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3),
        ]);
      }
    }
    return out;
  }
  const PATH = catmull(CTRL, 40);
  const N = PATH.length;
  // сетка для быстрого поиска ближайшей точки трассы
  const CELL = 120;
  const grid = new Map();
  PATH.forEach((p, i) => {
    const k = ((p[0] / CELL) | 0) + ',' + ((p[1] / CELL) | 0);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  });
  function nearest(x, y) {
    let best = -1, bd = Infinity;
    const gx = (x / CELL) | 0, gy = (y / CELL) | 0;
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
      const cell = grid.get((gx + dx) + ',' + (gy + dy));
      if (!cell) continue;
      for (const i of cell) {
        const d = (PATH[i][0] - x) ** 2 + (PATH[i][1] - y) ** 2;
        if (d < bd) { bd = d; best = i; }
      }
    }
    if (best < 0) { // далеко от трассы — полный перебор
      for (let i = 0; i < N; i++) { const d = (PATH[i][0] - x) ** 2 + (PATH[i][1] - y) ** 2; if (d < bd) { bd = d; best = i; } }
    }
    return { i: best, d: Math.sqrt(bd) };
  }

  // ── статичный мир: асфальт, обочины, разметка — рисуется один раз ────────
  const WORLD = 1700;
  const world = document.createElement('canvas');
  world.width = WORLD; world.height = WORLD;
  const wc = world.getContext('2d');
  function paintWorld() {
    wc.fillStyle = '#3a4a2f';                          // трава
    wc.fillRect(0, 0, WORLD, WORLD);
    // лёгкая фактура травы
    wc.fillStyle = 'rgba(0,0,0,.08)';
    for (let i = 0; i < 2600; i++) wc.fillRect(Math.random() * WORLD, Math.random() * WORLD, 2 + Math.random() * 4, 1);
    const trace = () => { wc.beginPath(); PATH.forEach((p, i) => i ? wc.lineTo(p[0], p[1]) : wc.moveTo(p[0], p[1])); wc.closePath(); };
    wc.lineJoin = 'round'; wc.lineCap = 'round';
    trace(); wc.strokeStyle = '#b89a62'; wc.lineWidth = TRACK_W + 34; wc.stroke();      // песчаная обочина
    trace(); wc.strokeStyle = '#d0d0cc'; wc.lineWidth = TRACK_W + 10; wc.stroke();      // поребрик-основа
    trace(); wc.strokeStyle = '#2a2b2e'; wc.lineWidth = TRACK_W; wc.stroke();           // асфальт
    // красно-белые поребрики по краям
    wc.setLineDash([26, 26]);
    wc.lineWidth = 6;
    for (const side of [-1, 1]) {
      wc.beginPath();
      PATH.forEach((p, i) => {
        const q = PATH[(i + 1) % N];
        const dx = q[0] - p[0], dy = q[1] - p[1], l = Math.hypot(dx, dy) || 1;
        const nx = -dy / l * side * (TRACK_W / 2 + 2), ny = dx / l * side * (TRACK_W / 2 + 2);
        i ? wc.lineTo(p[0] + nx, p[1] + ny) : wc.moveTo(p[0] + nx, p[1] + ny);
      });
      wc.closePath();
      wc.strokeStyle = '#d9342b'; wc.stroke();
    }
    wc.setLineDash([]);
    // осевая разметка
    trace(); wc.setLineDash([22, 30]); wc.strokeStyle = 'rgba(255,255,255,.28)'; wc.lineWidth = 3; wc.stroke(); wc.setLineDash([]);
    // стартовая линия
    const s = PATH[0], s2 = PATH[3];
    const ang = Math.atan2(s2[1] - s[1], s2[0] - s[0]);
    wc.save(); wc.translate(s[0], s[1]); wc.rotate(ang);
    for (let i = -3; i < 3; i++) for (let j = 0; j < 2; j++) {
      wc.fillStyle = (i + j) % 2 ? '#111' : '#eee';
      wc.fillRect(j * 8 - 8, i * TRACK_W / 6, 8, TRACK_W / 6);
    }
    wc.restore();
  }
  paintWorld();
  // следы шин и дым — отдельный слой поверх мира, копится за заезд
  const marks = document.createElement('canvas');
  marks.width = WORLD; marks.height = WORLD;
  const mc = marks.getContext('2d');

  // ── машина ───────────────────────────────────────────────────────────────
  const car = { x: 0, y: 0, a: 0, vx: 0, vy: 0, slip: 0, speed: 0 };
  const P = {
    accel: 260, maxSpeed: 330, drag: 0.35,
    gripNormal: 7.5, gripDrift: 2.0,
    turnNormal: 1.7, turnDrift: 2.6,
    minDriftSpeed: 100, slipMin: 0.2,
  };
  let steer = 0;               // -1 влево, 1 вправо, 0 отпущено
  let running = false, score = 0, combo = 1, comboTimer = 0, driftRun = 0, bestDrift = 0, laps = 0, lastIdx = 0;
  let best = 0;
  try { best = +localStorage.getItem('drift.best') || 0; } catch (e) {}
  const $ = id => document.getElementById(id);
  $('best').textContent = best;

  function reset() {
    const s = PATH[0], s2 = PATH[4];
    car.x = s[0]; car.y = s[1]; car.a = Math.atan2(s2[1] - s[1], s2[0] - s[0]);
    car.vx = Math.cos(car.a) * 60; car.vy = Math.sin(car.a) * 60; car.slip = 0; car.speed = 60;
    score = 0; combo = 1; comboTimer = 0; driftRun = 0; bestDrift = 0; laps = 0; lastIdx = 0;
    mc.clearRect(0, 0, WORLD, WORLD);
    particles.length = 0;
    $('score').textContent = '0'; $('combo').textContent = '×1';
  }

  const particles = [];
  function puff(x, y, strength) {
    particles.push({ x, y, r: 6 + Math.random() * 6, life: 0.7 + Math.random() * 0.4, t: 0, s: strength,
      vx: (Math.random() - .5) * 30, vy: (Math.random() - .5) * 30 });
  }

  function step(dt) {
    const f = [Math.cos(car.a), Math.sin(car.a)];
    const r = [-f[1], f[0]];
    let vf = car.vx * f[0] + car.vy * f[1];
    let vl = car.vx * r[0] + car.vy * r[1];
    const drifting = steer !== 0 && car.speed > P.minDriftSpeed;

    vf += P.accel * dt * (1 - Math.max(0, vf) / P.maxSpeed);
    vf *= Math.exp(-P.drag * dt * (drifting ? 1.6 : 1));
    const grip = drifting ? P.gripDrift : P.gripNormal;
    vl *= Math.exp(-grip * dt);

    const speedFactor = Math.min(1, car.speed / 180);
    const turn = drifting ? P.turnDrift : P.turnNormal;
    car.a += steer * turn * speedFactor * dt;
    if (!drifting && Math.abs(car.slip) > 0.05) {
      // самовыравнивание после заноса: корпус доворачивается к направлению движения
      car.a += Math.sign(car.slip) * Math.min(Math.abs(car.slip), 4 * dt);
    }

    car.vx = f[0] * vf + r[0] * vl; car.vy = f[1] * vf + r[1] * vl;
    car.x += car.vx * dt; car.y += car.vy * dt;
    car.speed = Math.hypot(car.vx, car.vy);
    car.slip = Math.atan2(vl, Math.max(vf, 1));

    // очки: угол заноса × скорость, серия растёт пока держится
    const inDrift = Math.abs(car.slip) > P.slipMin && car.speed > P.minDriftSpeed;
    if (inDrift) {
      driftRun += dt;
      comboTimer = 0;
      const gain = Math.abs(car.slip) * car.speed * dt * 0.9 * combo;
      score += gain;
      if (driftRun > 1.5 * combo && combo < 8) { combo++; $('combo').textContent = '×' + combo; }
      bestDrift = Math.max(bestDrift, driftRun);
      // следы шин
      const back = [car.x - f[0] * 14, car.y - f[1] * 14];
      mc.strokeStyle = 'rgba(15,15,15,' + Math.min(0.7, Math.abs(car.slip)) + ')';
      mc.lineWidth = 4;
      for (const side of [-1, 1]) {
        const px = back[0] + r[0] * side * 8, py = back[1] + r[1] * side * 8;
        mc.beginPath(); mc.moveTo(px - car.vx * dt, py - car.vy * dt); mc.lineTo(px, py); mc.stroke();
      }
      if (Math.random() < 0.7) puff(back[0] + r[0] * (Math.random() - .5) * 16, back[1] + r[1] * (Math.random() - .5) * 16, Math.abs(car.slip));
    } else {
      comboTimer += dt;
      if (driftRun > 0) driftRun = 0;
      if (comboTimer > 0.8 && combo > 1) { combo = 1; $('combo').textContent = '×1'; }
    }
    $('score').textContent = Math.floor(score);

    // трасса: расстояние до оси, круги
    const nr = nearest(car.x, car.y);
    if (nr.d > TRACK_W / 2 + 14) return crash();
    if (lastIdx > N * 0.8 && nr.i < N * 0.2) laps++;
    lastIdx = nr.i;

    for (let i = particles.length - 1; i >= 0; i--) {
      const q = particles[i];
      q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.r += 26 * dt;
      if (q.t > q.life) particles.splice(i, 1);
    }
  }

  function crash() {
    running = false;
    const total = Math.floor(score);
    let isRecord = false;
    if (total > best) { best = total; isRecord = true; try { localStorage.setItem('drift.best', best); } catch (e) {} }
    $('best').textContent = best;
    $('recLabel').textContent = isRecord ? 'Новый рекорд!' : 'Вылет с трассы';
    $('finalScore').textContent = total;
    $('finalSub').textContent = `Самый длинный занос — ${bestDrift.toFixed(1)} с · кругов ${laps}`;
    $('over').hidden = false;
    if (navigator.vibrate) navigator.vibrate(80);
  }

  // ── отрисовка ────────────────────────────────────────────────────────────
  function draw() {
    ctx.fillStyle = '#3a4a2f'; ctx.fillRect(0, 0, W, H);
    ctx.save();
    const cx = W / 2, cy = H * 0.58, ZOOM = 1.25;   // камера чуть ближе: машина крупнее на телефоне
    ctx.translate(cx, cy); ctx.scale(ZOOM, ZOOM); ctx.translate(-car.x, -car.y);
    ctx.drawImage(world, 0, 0);
    ctx.drawImage(marks, 0, 0);
    // дым
    for (const q of particles) {
      const k = 1 - q.t / q.life;
      ctx.fillStyle = `rgba(235,235,235,${(0.35 * k * Math.min(1, q.s + .3)).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill();
    }
    // машина
    ctx.translate(car.x, car.y); ctx.rotate(car.a);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(-19, -9, 38, 20);           // тень
    ctx.fillStyle = '#111'; [[-13, -11], [-13, 6], [8, -11], [8, 6]].forEach(([x, y]) => ctx.fillRect(x, y, 8, 5)); // колёса
    ctx.fillStyle = '#ffb000'; ctx.beginPath(); ctx.roundRect(-18, -8, 36, 16, 4); ctx.fill();   // кузов
    ctx.fillStyle = '#1b1b1b'; ctx.fillRect(-4, -6, 11, 12);                       // кабина
    ctx.fillStyle = '#ffe9a8'; ctx.fillRect(16, -6, 3, 4); ctx.fillRect(16, 2, 3, 4);  // фары
    ctx.fillStyle = steer ? '#ff4b3e' : '#8a2a22'; ctx.fillRect(-19, -6, 2, 4); ctx.fillRect(-19, 2, 2, 4); // стопы
    ctx.restore();
  }

  let last = 0, frames = 0;
  // ?auto=1 — самопроверка без рук: машина сама чередует заносы, состояние в title
  const AUTO = new URLSearchParams(location.search).get('auto');
  function loop(ts) {
    const dt = Math.min(0.033, (ts - last) / 1000 || 0.016); last = ts; frames++;
    if (AUTO && running) { const ph = Math.floor(ts / 1100) % 3; steer = ph === 0 ? 1 : ph === 1 ? -1 : 0; }
    if (running) step(dt);
    draw();
    if (AUTO) document.title = `f${frames} v${car.speed | 0} slip${(car.slip * 57) | 0} s${score | 0} ${running ? '' : 'CRASH'}`;
    requestAnimationFrame(loop);
  }

  // ── управление: половины экрана ──────────────────────────────────────────
  const touches = new Map();
  function updateSteer() {
    let l = 0, r = 0;
    touches.forEach(x => (x < W / 2 ? l++ : r++));
    steer = l && !r ? -1 : r && !l ? 1 : 0;
    $('zl').classList.toggle('on', steer === -1); $('zr').classList.toggle('on', steer === 1);
    if (steer) $('hint').classList.add('hide');
  }
  canvas.addEventListener('pointerdown', e => { touches.set(e.pointerId, e.clientX); updateSteer(); });
  canvas.addEventListener('pointermove', e => { if (touches.has(e.pointerId)) { touches.set(e.pointerId, e.clientX); updateSteer(); } });
  const up = e => { touches.delete(e.pointerId); updateSteer(); };
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up); canvas.addEventListener('pointerleave', up);
  window.addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === 'a') { touches.set('k', 0); updateSteer(); } if (e.key === 'ArrowRight' || e.key === 'd') { touches.set('k', W); updateSteer(); } });
  window.addEventListener('keyup', e => { if (['ArrowLeft', 'ArrowRight', 'a', 'd'].includes(e.key)) { touches.delete('k'); updateSteer(); } });

  function start() {
    reset();
    $('start').hidden = true; $('over').hidden = true;
    running = true;
    if (document.documentElement.requestFullscreen && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  }
  $('go').addEventListener('click', start);
  $('again').addEventListener('click', start);

  reset();
  requestAnimationFrame(loop);

  // ?sim=1 — синхронная прогонка физики без экрана (для проверки на Pi):
  // чередует заносы и пишет в title, сколько шагов продержалась машина.
  if (new URLSearchParams(location.search).get('sim')) {
    reset(); running = true;
    const log = [];
    let t = 0;
    const mode = new URLSearchParams(location.search).get('sim');
    for (let i = 0; i < 6000 && running; i++) {
      if (mode === 'pilot' || mode === 'shot') {
        // автопилот-«человек»: смотрит на точку трассы впереди и держит палец,
        // пока нос не смотрит туда; так проверяется проходимость трассы
        const nr = nearest(car.x, car.y);
        const tgt = PATH[(nr.i + 28) % N];
        let da = Math.atan2(tgt[1] - car.y, tgt[0] - car.x) - car.a;
        da = Math.atan2(Math.sin(da), Math.cos(da));
        steer = da > 0.14 ? 1 : da < -0.14 ? -1 : 0;
      } else { const ph = Math.floor(t / 1.1) % 3; steer = ph === 0 ? 1 : ph === 1 ? -1 : 0; }
      step(1 / 60); t += 1 / 60;
      if (mode === 'shot' && t > 9 && Math.abs(car.slip) > 0.3) break;   // кадр в заносе
      if (i % 60 === 0) log.push(`${t.toFixed(0)}s v${car.speed | 0} slip${(car.slip * 57.3) | 0} d${nearest(car.x, car.y).d | 0} sc${score | 0}`);
    }
    $('start').hidden = true; draw();
    document.title = (running ? 'ALIVE ' : 'CRASH@' + t.toFixed(1) + 's ') + 'laps' + laps + ' best' + bestDrift.toFixed(1) + ' | ' + log.join(' | ');
  }

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
