<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Занос</title>
<style>
  :root { --bg: #14161a; --ink: #f2efe6; --muted: #9a9c9f; --accent: #ffb000; --danger: #ff4b3e; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 16px/1.3 "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top)) 16px 0; display: flex;
    justify-content: space-between; align-items: flex-start; pointer-events: none; }
  .hud .score { font-size: 34px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  .hud .best { font-size: 13px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .hud .combo { text-align: right; font-size: 13px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .hud .combo b { display: block; font-size: 28px; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1; }
  .hint { position: fixed; left: 0; right: 0; bottom: calc(24px + env(safe-area-inset-bottom)); text-align: center; color: var(--muted);
    font-size: 14px; pointer-events: none; opacity: 1; transition: opacity .4s; }
  .hint.hide { opacity: 0; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: rgba(20,22,26,.72); backdrop-filter: blur(2px); text-align: center; padding: 24px; }
  .overlay[hidden] { display: none; }
  .overlay h1 { margin: 0; font-size: 44px; font-weight: 900; letter-spacing: -.03em; }
  .overlay .sub { color: var(--muted); max-width: 320px; }
  .overlay .big { font-size: 56px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; margin: 6px 0 0; }
  .overlay .rec { color: var(--accent); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; }
  .overlay button { margin-top: 18px; font: inherit; font-weight: 700; font-size: 18px; padding: 14px 34px; border-radius: 999px; border: 0;
    background: var(--accent); color: #1a1200; cursor: pointer; }
  .overlay button:active { transform: scale(.97); }
  .opts { margin-top: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--muted); }
  .opts label { display: flex; align-items: center; gap: 8px; justify-content: center; }
  .opts input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  .opts .file { flex-direction: column; gap: 4px; }
  .opts input[type=file] { font-size: 12px; max-width: 240px; }
  .zones { position: fixed; inset: 0; display: flex; pointer-events: none; }
  .zones div { flex: 1; }
  .zones div.on { background: radial-gradient(ellipse at 50% 100%, rgba(255,176,0,.10), transparent 70%); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="zones" aria-hidden="true"><div id="zl"></div><div id="zr"></div></div>
<div class="hud" aria-live="polite">
  <div><div class="score" id="score">0</div><div class="best">рекорд <span id="best">0</span></div></div>
  <div class="combo"><b id="combo">×1</b>серия</div>
</div>
<div class="hint" id="hint">Держите — занос углубляется, отпустите — выровняется</div>
<div class="overlay" id="start">
  <h1>Занос</h1>
  <div class="sub">Машина едет сама. Держите палец на левой или правой половине экрана: чем дольше держите, тем глубже занос; отпустите — выровняется. Очки — за угол и длину заноса. Вылет с трассы — конец заезда.</div>
  <button type="button" id="go">Поехали</button>
  <div class="opts">
    <label><input type="checkbox" id="optSfx" checked> звук шин и мотора</label>
    <label><input type="checkbox" id="optMusic" checked> евробит</label>
    <label class="file">своя музыка (mp3 с телефона) <input type="file" id="optFile" accept="audio/*"></label>
  </div>
</div>
<div class="overlay" id="over" hidden>
  <div class="rec" id="recLabel">Заезд окончен</div>
  <div class="big" id="finalScore">0</div>
  <div class="sub" id="finalSub"></div>
  <button type="button" id="again">Ещё раз</button>
</div>

<script>
(function () {
  'use strict';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize); resize();

  // ── трасса: замкнутая извилистая кривая, повороты в обе стороны ──────────
  // Трасса — деформированное кольцо r(θ) = 560 + Σ A·sin(kθ+φ), k = 2, 3, 5:
  // такая кривая не самопересекается, а разные гармоники дают повороты
  // разного радиуса — от шпилек (~95 px) до широких дуг и почти прямых.
  // Точки подобраны перебором с проверкой зазора между ветками (≥ 280 px)
  // и минимального радиуса; старт — в точке 0 (восток), движение по часовой.
  const CTRL = [
    [1492, 850], [1480, 1035], [1318, 1151], [1169, 1218], [1065, 1321], [927, 1388],
    [780, 1336], [656, 1275], [474, 1284], [256, 1232], [184, 1046], [281, 850],
    [367, 708], [395, 558], [488, 432], [646, 404], [783, 386], [930, 296],
    [1117, 265], [1243, 397], [1282, 572], [1367, 698],
  ];
  const TRACK_W = 118;                 // ширина полотна
  function catmull(pts, seg) {
    const out = [];
    const n = pts.length;
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      for (let t = 0; t < 1; t += 1 / seg) {
        const t2 = t * t, t3 = t2 * t;
        out.push([
          0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
          0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3),
        ]);
      }
    }
    return out;
  }
  const PATH = catmull(CTRL, 24);
  const N = PATH.length;
  // сетка для быстрого поиска ближайшей точки трассы
  const CELL = 120;
  const grid = new Map();
  PATH.forEach((p, i) => {
    const k = ((p[0] / CELL) | 0) + ',' + ((p[1] / CELL) | 0);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  });
  function nearest(x, y) {
    let best = -1, bd = Infinity;
    const gx = (x / CELL) | 0, gy = (y / CELL) | 0;
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
      const cell = grid.get((gx + dx) + ',' + (gy + dy));
      if (!cell) continue;
      for (const i of cell) {
        const d = (PATH[i][0] - x) ** 2 + (PATH[i][1] - y) ** 2;
        if (d < bd) { bd = d; best = i; }
      }
    }
    if (best < 0) { // далеко от трассы — полный перебор
      for (let i = 0; i < N; i++) { const d = (PATH[i][0] - x) ** 2 + (PATH[i][1] - y) ** 2; if (d < bd) { bd = d; best = i; } }
    }
    return { i: best, d: Math.sqrt(bd) };
  }

  // ── статичный мир: асфальт, обочины, разметка — рисуется один раз ────────
  const WORLD = 1700;
  const world = document.createElement('canvas');
  world.width = WORLD; world.height = WORLD;
  const wc = world.getContext('2d');
  function paintWorld() {
    wc.fillStyle = '#3a4a2f';                          // трава
    wc.fillRect(0, 0, WORLD, WORLD);
    // лёгкая фактура травы
    wc.fillStyle = 'rgba(0,0,0,.08)';
    for (let i = 0; i < 2600; i++) wc.fillRect(Math.random() * WORLD, Math.random() * WORLD, 2 + Math.random() * 4, 1);
    const trace = () => { wc.beginPath(); PATH.forEach((p, i) => i ? wc.lineTo(p[0], p[1]) : wc.moveTo(p[0], p[1])); wc.closePath(); };
    wc.lineJoin = 'round'; wc.lineCap = 'round';
    trace(); wc.strokeStyle = '#b89a62'; wc.lineWidth = TRACK_W + 34; wc.stroke();      // песчаная обочина
    trace(); wc.strokeStyle = '#e8e8e4'; wc.lineWidth = TRACK_W + 12; wc.stroke();      // белая основа поребрика
    wc.setLineDash([24, 24]); wc.lineCap = 'butt';
    trace(); wc.strokeStyle = '#d9342b'; wc.lineWidth = TRACK_W + 12; wc.stroke();      // красные штрихи поверх
    wc.setLineDash([]); wc.lineCap = 'round';
    trace(); wc.strokeStyle = '#2a2b2e'; wc.lineWidth = TRACK_W; wc.stroke();           // асфальт закрывает середину
    // осевая разметка
    trace(); wc.setLineDash([22, 30]); wc.strokeStyle = 'rgba(255,255,255,.28)'; wc.lineWidth = 3; wc.stroke(); wc.setLineDash([]);
    // стартовая линия: шахматка в два ряда поперёк полотна
    const s0 = PATH[0], s1 = PATH[2];
    const ang = Math.atan2(s1[1] - s0[1], s1[0] - s0[0]);
    wc.save(); wc.translate(s0[0], s0[1]); wc.rotate(ang);
    const cell = TRACK_W / 10;
    for (let i = -5; i < 5; i++) for (let j = 0; j < 2; j++) {
      wc.fillStyle = (i + j) % 2 ? '#111' : '#eee';
      wc.fillRect(j * cell - cell, i * cell, cell, cell);
    }
    wc.restore();
  }
  paintWorld();
  // следы шин и дым — отдельный слой поверх мира, копится за заезд
  const marks = document.createElement('canvas');
  marks.width = WORLD; marks.height = WORLD;
  const mc = marks.getContext('2d');

  // ── машина ───────────────────────────────────────────────────────────────
  const car = { x: 0, y: 0, a: 0, vx: 0, vy: 0, slip: 0, speed: 0, w: 0, depth: 0 };
  const P = {
    accel: 260, maxSpeed: 330, drag: 0.35,
    gripNormal: 6.5, gripDrift: 0.9,
    turnNormal: 1.7, turnDrift: 2.3,
    minDriftSpeed: 100, slipMin: 0.2,
  };
  let steer = 0;               // -1 влево, 1 вправо, 0 отпущено
  let hold = 0;                // сколько секунд палец держится: чем дольше, тем глубже занос
  let running = false, score = 0, combo = 1, comboTimer = 0, driftRun = 0, series = 0, bestDrift = 0, laps = 0, lastIdx = 0;
  let best = 0;
  try { best = +localStorage.getItem('drift.best') || 0; } catch (e) {}
  const $ = id => document.getElementById(id);
  $('best').textContent = best;

  function reset() {
    const s = PATH[0], s2 = PATH[4];
    car.x = s[0]; car.y = s[1]; car.a = Math.atan2(s2[1] - s[1], s2[0] - s[0]);
    car.vx = Math.cos(car.a) * 60; car.vy = Math.sin(car.a) * 60; car.slip = 0; car.speed = 60; car.w = 0; car.depth = 0;
    score = 0; combo = 1; comboTimer = 0; driftRun = 0; series = 0; bestDrift = 0; laps = 0; lastIdx = 0;
    mc.clearRect(0, 0, WORLD, WORLD);
    particles.length = 0;
    $('score').textContent = '0'; $('combo').textContent = '×1';
  }

  const particles = [];
  function puff(x, y, strength) {
    particles.push({ x, y, r: 6 + Math.random() * 6, life: 0.7 + Math.random() * 0.4, t: 0, s: strength,
      vx: (Math.random() - .5) * 30, vy: (Math.random() - .5) * 30 });
  }

  function step(dt) {
    const f = [Math.cos(car.a), Math.sin(car.a)];
    const r = [-f[1], f[0]];
    let vf = car.vx * f[0] + car.vy * f[1];
    let vl = car.vx * r[0] + car.vy * r[1];
    const drifting = steer !== 0 && car.speed > P.minDriftSpeed;
    hold = steer ? hold + dt : 0;
    // глубина заноса нарастает с удержанием: в первые полсекунды это мягкий
    // поворот, к полутора секундам — полноценный занос с малым сцеплением.
    // После отпускания глубина не обнуляется, а тает: занос затухает по инерции.
    const target = drifting ? Math.min(1, hold / 1.2) : 0;
    car.depth += (target - car.depth) * (drifting ? 3.5 : 0.6) * dt;
    const depth = car.depth;

    vf += P.accel * dt * (1 - Math.max(0, vf) / P.maxSpeed);
    vf *= Math.exp(-P.drag * dt * (1 + 0.45 * depth));
    const grip = P.gripNormal + (P.gripDrift - P.gripNormal) * depth;
    vl *= Math.exp(-grip * dt);

    // вращение корпуса — через угловую скорость с инерцией: руль задаёт
    // целевую скорость, корпус набирает и сбрасывает её не мгновенно
    const speedFactor = Math.min(1, car.speed / 180);
    const turnTarget = steer * (P.turnNormal + (P.turnDrift - P.turnNormal) * depth) * speedFactor;
    car.w += (turnTarget - car.w) * (steer ? 6 : 1.5) * dt;
    car.a += car.w * dt;
    if (!steer && Math.abs(car.slip) > 0.05) {
      // самовыравнивание: корпус доворачивается к направлению движения, медленнее при глубоком заносе
      car.a += Math.sign(car.slip) * Math.min(Math.abs(car.slip), (2.0 - 1.4 * depth) * dt);
    }

    car.vx = f[0] * vf + r[0] * vl; car.vy = f[1] * vf + r[1] * vl;
    car.x += car.vx * dt; car.y += car.vy * dt;
    car.speed = Math.hypot(car.vx, car.vy);
    car.slip = Math.atan2(vl, Math.max(vf, 1));

    // очки: угол заноса × скорость, серия растёт пока держится
    const inDrift = Math.abs(car.slip) > P.slipMin && car.speed > P.minDriftSpeed;
    if (inDrift) {
      driftRun += dt; series += dt;
      comboTimer = 0;
      const gain = Math.abs(car.slip) * car.speed * dt * 0.9 * combo;
      score += gain;
      // ступень серии — за каждую секунду заноса подряд; короткие перерывы
      // (до 1,2 с) серию не обнуляют, поэтому время копится между заносами
      if (series > combo * 1.0 && combo < 8) { combo++; $('combo').textContent = '×' + combo; if (navigator.vibrate) navigator.vibrate(20); }
      bestDrift = Math.max(bestDrift, driftRun);
      // следы шин
      const back = [car.x - f[0] * 18, car.y - f[1] * 18];
      mc.strokeStyle = 'rgba(15,15,15,' + Math.min(0.7, Math.abs(car.slip)) + ')';
      mc.lineWidth = 4;
      for (const side of [-1, 1]) {
        const px = back[0] + r[0] * side * 11, py = back[1] + r[1] * side * 11;
        mc.beginPath(); mc.moveTo(px - car.vx * dt, py - car.vy * dt); mc.lineTo(px, py); mc.stroke();
      }
      if (Math.random() < 0.7) puff(back[0] + r[0] * (Math.random() - .5) * 16, back[1] + r[1] * (Math.random() - .5) * 16, Math.abs(car.slip));
    } else {
      comboTimer += dt;
      if (driftRun > 0) driftRun = 0;
      if (comboTimer > 1.2 && (combo > 1 || series > 0)) { combo = 1; series = 0; $('combo').textContent = '×1'; }
    }
    $('score').textContent = Math.floor(score);

    // трасса: расстояние до оси, круги
    const nr = nearest(car.x, car.y);
    if (nr.d > TRACK_W / 2 + 14) return crash();
    if (lastIdx > N * 0.8 && nr.i < N * 0.2) laps++;
    lastIdx = nr.i;

    for (let i = particles.length - 1; i >= 0; i--) {
      const q = particles[i];
      q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.r += 26 * dt;
      if (q.t > q.life) particles.splice(i, 1);
    }
  }

  function crash() {
    running = false;
    musicStop();
    const total = Math.floor(score);
    let isRecord = false;
    if (total > best) { best = total; isRecord = true; try { localStorage.setItem('drift.best', best); } catch (e) {} }
    $('best').textContent = best;
    $('recLabel').textContent = isRecord ? 'Новый рекорд!' : 'Вылет с трассы';
    $('finalScore').textContent = total;
    $('finalSub').textContent = `Самый длинный занос — ${bestDrift.toFixed(1)} с · кругов ${laps}`;
    $('over').hidden = false;
    if (navigator.vibrate) navigator.vibrate(80);
  }

  // ── отрисовка ────────────────────────────────────────────────────────────
  function draw() {
    ctx.fillStyle = '#3a4a2f'; ctx.fillRect(0, 0, W, H);
    ctx.save();
    const cx = W / 2, cy = H * 0.58, ZOOM = 1.2;   // камера чуть ближе: машина крупнее на телефоне
    ctx.translate(cx, cy); ctx.scale(ZOOM, ZOOM); ctx.translate(-car.x, -car.y);
    ctx.drawImage(world, 0, 0);
    ctx.drawImage(marks, 0, 0);
    // дым
    for (const q of particles) {
      const k = 1 - q.t / q.life;
      ctx.fillStyle = `rgba(235,235,235,${(0.35 * k * Math.min(1, q.s + .3)).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill();
    }
    // машина
    ctx.translate(car.x, car.y); ctx.rotate(car.a);
    drawCar(ctx);
    ctx.restore();
  }

  // AE86 Trueno (трёхдверный хэтчбек) в «панде»: длинный капот, кабина
  // смещена к корме, квадратные выдвижные фары подняты, спойлер на крышке
  // багажника, чёрный низ по бортам и бамперам. Нос — вправо, 52×22.
  function drawCar(c) {
    c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(-27, -12, 54, 26);                          // тень
    c.fillStyle = '#111';
    [[-19, -14], [-19, 9], [13, -14], [13, 9]].forEach(([x, y]) => c.fillRect(x, y, 9, 5));     // колёса
    // чёрный низ (пороги и бамперы) — чуть шире кузова
    c.fillStyle = '#141414'; c.beginPath(); c.roundRect(-26, -11, 52, 22, 3); c.fill();
    // белый кузов: клиновидный нос, прямая корма
    c.fillStyle = '#f5f5f1';
    c.beginPath(); c.moveTo(-24, -8.5); c.lineTo(14, -8.5); c.lineTo(23, -6.5); c.lineTo(23, 6.5); c.lineTo(14, 8.5); c.lineTo(-24, 8.5); c.closePath(); c.fill();
    // капот: линии-рёбра
    c.strokeStyle = 'rgba(0,0,0,.18)'; c.lineWidth = 1; c.beginPath(); c.moveTo(4, -6); c.lineTo(20, -5); c.moveTo(4, 6); c.lineTo(20, 5); c.stroke();
    // лобовое стекло (наклонное), крыша, заднее стекло хэтчбека
    c.fillStyle = '#1c1f24';
    c.beginPath(); c.moveTo(4, -7.5); c.lineTo(-2, -7.5); c.lineTo(-4, 7.5); c.lineTo(4, 7.5); c.closePath(); c.fill();   // лобовое
    c.fillStyle = '#f5f5f1'; c.fillRect(-11, -7, 8, 14);                                                                  // крыша
    c.fillStyle = '#1c1f24'; c.beginPath(); c.moveTo(-11, -7.5); c.lineTo(-20, -6.5); c.lineTo(-20, 6.5); c.lineTo(-11, 7.5); c.closePath(); c.fill(); // заднее стекло
    // боковые стёкла — тёмная полоса вдоль кабины
    c.fillStyle = '#1c1f24'; c.fillRect(-12, -8.5, 16, 1.5); c.fillRect(-12, 7, 16, 1.5);
    // зеркала
    c.fillStyle = '#141414'; c.fillRect(2, -11, 3, 2.5); c.fillRect(2, 8.5, 3, 2.5);
    // спойлер
    c.fillStyle = '#141414'; c.fillRect(-25, -9.5, 3, 19);
    // выдвижные фары: подняты в заносе (светятся), иначе закрыты
    if (steer || car.depth > 0.2) { c.fillStyle = '#fff3c4'; c.fillRect(17, -8, 5, 4.5); c.fillRect(17, 3.5, 5, 4.5); c.fillStyle = 'rgba(255,240,180,.35)'; c.fillRect(22, -9, 8, 18); }
    else { c.fillStyle = '#e6e6e2'; c.fillRect(17, -8, 5, 4.5); c.fillRect(17, 3.5, 5, 4.5); }
    // задний фонарь-полоса и стопы
    c.fillStyle = steer ? '#ff3b2e' : '#8c1f18'; c.fillRect(-26.5, -7, 2, 14);
    // глушитель
    c.fillStyle = '#9a9a9a'; c.fillRect(-28, 3, 2.5, 3);
  }

  let last = 0, frames = 0;
  // ?auto=1 — самопроверка без рук: машина сама чередует заносы, состояние в title
  const AUTO = new URLSearchParams(location.search).get('auto');
  function loop(ts) {
    const dt = Math.min(0.033, (ts - last) / 1000 || 0.016); last = ts; frames++;
    if (AUTO && running) { const ph = Math.floor(ts / 1100) % 3; steer = ph === 0 ? 1 : ph === 1 ? -1 : 0; }
    if (running) step(dt);
    audioUpdate();
    draw();
    if (AUTO) document.title = `f${frames} v${car.speed | 0} slip${(car.slip * 57) | 0} s${score | 0} ${running ? '' : 'CRASH'}`;
    requestAnimationFrame(loop);
  }

  // ── управление: половины экрана ──────────────────────────────────────────
  const touches = new Map();
  function updateSteer() {
    let l = 0, r = 0;
    touches.forEach(x => (x < W / 2 ? l++ : r++));
    steer = l && !r ? -1 : r && !l ? 1 : 0;
    $('zl').classList.toggle('on', steer === -1); $('zr').classList.toggle('on', steer === 1);
    if (steer) $('hint').classList.add('hide');
  }
  canvas.addEventListener('pointerdown', e => { touches.set(e.pointerId, e.clientX); updateSteer(); });
  canvas.addEventListener('pointermove', e => { if (touches.has(e.pointerId)) { touches.set(e.pointerId, e.clientX); updateSteer(); } });
  const up = e => { touches.delete(e.pointerId); updateSteer(); };
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up); canvas.addEventListener('pointerleave', up);
  window.addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === 'a') { touches.set('k', 0); updateSteer(); } if (e.key === 'ArrowRight' || e.key === 'd') { touches.set('k', W); updateSteer(); } });
  window.addEventListener('keyup', e => { if (['ArrowLeft', 'ArrowRight', 'a', 'd'].includes(e.key)) { touches.delete('k'); updateSteer(); } });

  // ── звук: всё синтезом, без файлов ────────────────────────────────────
  // Визг шин — белый шум через полосовой фильтр, частота и громкость растут
  // с углом заноса; мотор — пила через низкочастотный фильтр, высота по
  // скорости; евробит — генеративный луп 155 BPM (своя партия, не чужая запись).
  const audio = { ctx: null, on: false, music: true, sfx: true };
  let tireGain, tireGain2, tireFilter, tireFilter2, engOsc, engGain, musicGain, musicTimer = null, userTrack = null;
  function audioInit() {
    if (audio.ctx) { if (audio.ctx.state === 'suspended') audio.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ac = audio.ctx = new AC();
    // шум для шин
    const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    // покрышка «поёт» на двух резонансах: основной узкий (визг) и низкий
    // широкий (гул скольжения); частота основного дрожит — так звучит
    // прерывистое схватывание резины (stick-slip)
    tireFilter = ac.createBiquadFilter(); tireFilter.type = 'bandpass'; tireFilter.Q.value = 14; tireFilter.frequency.value = 1600;
    tireFilter2 = ac.createBiquadFilter(); tireFilter2.type = 'bandpass'; tireFilter2.Q.value = 2.5; tireFilter2.frequency.value = 420;
    tireGain = ac.createGain(); tireGain.gain.value = 0;
    tireGain2 = ac.createGain(); tireGain2.gain.value = 0;
    const wobble = ac.createOscillator(), wobbleGain = ac.createGain();
    wobble.type = 'sine'; wobble.frequency.value = 27; wobbleGain.gain.value = 90;   // дрожание ±90 Гц
    wobble.connect(wobbleGain).connect(tireFilter.frequency); wobble.start();
    const shaper = ac.createWaveShaper(); const curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) { const x = i / 128 - 1; curve[i] = Math.tanh(2.5 * x); }
    shaper.curve = curve;                                                          // лёгкая перегрузка — «злее»
    src.connect(tireFilter).connect(shaper).connect(tireGain).connect(ac.destination);
    src.connect(tireFilter2).connect(tireGain2).connect(ac.destination);
    src.start();
    // мотор
    engOsc = ac.createOscillator(); engOsc.type = 'sawtooth'; engOsc.frequency.value = 60;
    const engFilter = ac.createBiquadFilter(); engFilter.type = 'lowpass'; engFilter.frequency.value = 500;
    engGain = ac.createGain(); engGain.gain.value = 0;
    engOsc.connect(engFilter).connect(engGain).connect(ac.destination); engOsc.start();
    // музыка
    musicGain = ac.createGain(); musicGain.gain.value = 0.35; musicGain.connect(ac.destination);
    audio.on = true;
  }
  function audioUpdate() {
    if (!audio.on) return;
    const ac = audio.ctx, t = ac.currentTime;
    const sl = Math.abs(car.slip), squeal = audio.sfx && running && car.speed > 90 ? Math.min(1, Math.max(0, (sl - 0.12) / 0.5)) : 0;
    // визг появляется резко и держится, гул — плавно; высота растёт с углом и скоростью
    tireGain.gain.setTargetAtTime(squeal * 0.42, t, squeal > 0 ? 0.03 : 0.12);
    tireGain2.gain.setTargetAtTime(squeal * 0.5 + (car.depth > 0.3 ? 0.1 : 0), t, 0.08);
    tireFilter.frequency.setTargetAtTime(1200 + squeal * 900 + car.speed * 1.5, t, 0.06);
    tireFilter2.frequency.setTargetAtTime(300 + squeal * 250, t, 0.1);
    engOsc.frequency.setTargetAtTime(50 + car.speed * 0.55, t, 0.05);
    engGain.gain.setTargetAtTime(audio.sfx && running ? 0.05 + car.speed / 3300 : 0, t, 0.1);
  }
  // евробит: бочка на каждую долю, хэт на «и», бас октавами, синт-аккорды по кругу
  const BPM = 155, BEAT = 60 / BPM;
  const CHORDS = [[0, 3, 7], [-4, 0, 3], [-5, -2, 2], [-2, 2, 5]];   // Am, F, G, Em — полутоны от A
  const BASS = [-24, -24, -28, -28, -29, -29, -26, -26];
  let musicStep = 0, musicNext = 0;
  function note(semi, base = 220) { return base * Math.pow(2, semi / 12); }
  function musicTick() {
    if (!audio.on || !audio.music || userTrack) return;
    const ac = audio.ctx;
    while (musicNext < ac.currentTime + 0.25) {
      const st = musicStep % 32, bar = Math.floor(musicStep / 8) % 4, t = musicNext;
      // бочка
      if (st % 2 === 0) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12); g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18); o.connect(g).connect(musicGain); o.start(t); o.stop(t + 0.2); }
      // хэт
      if (st % 2 === 1) { const b = ac.createBufferSource(); b.buffer = tireFilter.context === ac ? hatBuf(ac) : null; const g = ac.createGain(); g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.06); const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6000; b.connect(f).connect(g).connect(musicGain); b.start(t); b.stop(t + 0.07); }
      // бас — октавный «галоп»
      { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'square'; o.frequency.value = note(BASS[bar * 2 + ((st >> 2) & 1)] + (st % 2 ? 12 : 0)); g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + BEAT * 0.45); o.connect(g).connect(musicGain); o.start(t); o.stop(t + BEAT * 0.5); }
      // синт-аккорд на 1 и 3 доли, короткий стаб на «и» 2-й
      if (st % 8 === 0 || st % 8 === 4 || st % 8 === 3) {
        for (const semi of CHORDS[bar]) { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sawtooth'; o.frequency.value = note(semi + 12); g.gain.setValueAtTime(0.07, t); g.gain.exponentialRampToValueAtTime(0.001, t + BEAT * 0.9); o.connect(g).connect(musicGain); o.start(t); o.stop(t + BEAT); }
      }
      musicStep++; musicNext += BEAT / 2;
    }
  }
  let _hat = null;
  function hatBuf(ac) { if (_hat) return _hat; const n = ac.sampleRate * 0.08, b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; return (_hat = b); }
  function musicStart() {
    if (!audio.on) return;
    if (userTrack) { userTrack.play().catch(() => {}); return; }
    if (musicTimer) return;
    musicNext = audio.ctx.currentTime + 0.1; musicStep = 0;
    musicTimer = setInterval(musicTick, 100); musicTick();
  }
  function musicStop() { if (musicTimer) { clearInterval(musicTimer); musicTimer = null; } if (userTrack) userTrack.pause(); }
  $('optSfx').addEventListener('change', e => { audio.sfx = e.target.checked; });
  $('optMusic').addEventListener('change', e => { audio.music = e.target.checked; if (!audio.music) musicStop(); else if (running) musicStart(); });
  $('optFile').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    if (userTrack) { userTrack.pause(); URL.revokeObjectURL(userTrack.src); }
    musicStop();
    userTrack = new Audio(URL.createObjectURL(f)); userTrack.loop = true; userTrack.volume = 0.6;
    $('optMusic').checked = true; audio.music = true;
  });

  function start() {
    audioInit();
    reset();
    $('start').hidden = true; $('over').hidden = true;
    running = true;
    if (audio.music) musicStart();
    if (document.documentElement.requestFullscreen && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  }
  $('go').addEventListener('click', start);
  $('again').addEventListener('click', start);

  reset();
  requestAnimationFrame(loop);

  // ?sim=1 — синхронная прогонка физики без экрана (для проверки на Pi):
  // чередует заносы и пишет в title, сколько шагов продержалась машина.
  if (new URLSearchParams(location.search).get('sim')) {
    reset(); running = true;
    const log = [];
    let t = 0;
    const mode = new URLSearchParams(location.search).get('sim');
    for (let i = 0; i < 6000 && running; i++) {
      if (mode === 'pilot' || mode === 'shot') {
        // автопилот-«человек»: смотрит на точку трассы впереди и держит палец,
        // пока нос не смотрит туда; так проверяется проходимость трассы
        const nr = nearest(car.x, car.y);
        const tgt = PATH[(nr.i + 28) % N];
        let da = Math.atan2(tgt[1] - car.y, tgt[0] - car.x) - car.a;
        da = Math.atan2(Math.sin(da), Math.cos(da));
        steer = da > 0.14 ? 1 : da < -0.14 ? -1 : 0;
      } else { const ph = Math.floor(t / 1.1) % 3; steer = ph === 0 ? 1 : ph === 1 ? -1 : 0; }
      step(1 / 60); t += 1 / 60;
      if (mode === 'shot' && t > 9 && Math.abs(car.slip) > 0.3) break;   // кадр в заносе
      if (i % 60 === 0) log.push(`${t.toFixed(0)}s v${car.speed | 0} slip${(car.slip * 57.3) | 0} d${nearest(car.x, car.y).d | 0} sc${score | 0}`);
    }
    $('start').hidden = true; draw();
    document.title = (running ? 'ALIVE ' : 'CRASH@' + t.toFixed(1) + 's ') + 'laps' + laps + ' best' + bestDrift.toFixed(1) + ' | ' + log.join(' | ');
  }

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
